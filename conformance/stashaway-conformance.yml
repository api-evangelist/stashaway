note: >-
  StashAway is a regulated capital-markets firm, not an API provider. Its published conformance is
  therefore regulatory and custodial, not technical: there is no OpenAPI, no OAuth surface, no
  RFC 9457 error format and no domain API standard to assert against, because there is no public
  contract. Every technical row below is recorded as `conforms: false` with the evidence that it was
  looked for and not found — an honest absence, not a penalty. No domain standard is asserted:
  StashAway publishes nothing in the FDX / ISO 20022 / Open Banking family, and inventing one to
  fill the slot is out of bounds.
