aid: stashaway
name: StashAway
description: >-
  StashAway is a digital wealth manager and robo-advisor headquartered in Singapore, operating as
  Asia Wealth Platform Pte Ltd under Monetary Authority of Singapore Capital Markets Services licence
  CMS100604 (issued May 2017). Founded in 2016, it offers goal-based, globally diversified ETF
  portfolios driven by its proprietary ERAA (Economic Regime-based Asset Allocation) framework, a
  self-directed ETF Explorer covering 80+ asset classes, Flexible, Thematic, Income, Responsible and
  Singapore-focused portfolios, StashAway Simple and Simple Plus cash management, and StashAway
  Reserve private-market access for accredited investors. It runs consumer web and mobile apps across
  Singapore, Malaysia, Hong Kong, Thailand and the UAE/MENA, with client assets held in segregated
  accounts at DBS, HSBC, Saxo Capital Markets and Lion Global. StashAway is an end-user wealth
  product: it publishes no public developer API, SDK or developer portal, though it does publish an
  llms.txt for AI agents and runs a public vulnerability disclosure programme.
